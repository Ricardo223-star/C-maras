<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMVIVO — Cámaras en vivo Argentina</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a0e;
    --surface: #0b1017;
    --card: #0f1820;
    --card2: #111b24;
    --border: #1a2535;
    --accent: #00d4ff;
    --accent2: #ff3350;
    --accent3: #00ff88;
    --text: #dce8f0;
    --muted: #3d5066;
    --muted2: #5a7080;
    --live: #00ff88;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─── */
  header {
    position: sticky;
    top: 0;
    z-index: 200;
    background: rgba(6,10,14,0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 5px;
    color: var(--accent);
    text-shadow: 0 0 24px rgba(0,212,255,0.5);
    user-select: none;
  }
  .logo span { color: var(--accent2); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .cam-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted2);
    letter-spacing: 1px;
  }

  .live-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(0,255,136,0.08);
    border: 1px solid rgba(0,255,136,0.25);
    border-radius: 20px;
    padding: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--live);
    letter-spacing: 2px;
  }

  .live-dot {
    width: 6px; height: 6px;
    background: var(--live);
    border-radius: 50%;
    animation: blink 1.2s ease-in-out infinite;
    box-shadow: 0 0 6px var(--live);
    flex-shrink: 0;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* ─── NAV ─── */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  nav::-webkit-scrollbar { display: none; }

  .nav-btn {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 700;
    box-shadow: 0 0 16px rgba(0,212,255,0.3);
  }

  /* ─── MAIN ─── */
  main {
    padding: 16px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .section-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    color: var(--muted2);
  }

  .section-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ─── GRID ─── */
  .cam-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }

  @media (min-width: 600px) {
    .cam-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
  }
  @media (min-width: 900px) {
    .cam-grid { grid-template-columns: repeat(4, 1fr); }
  }

  /* ─── CARD ─── */
  .cam-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
    display: block;
    animation: fadeUp 0.3s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .cam-card:active {
    transform: scale(0.96);
    border-color: var(--accent);
  }

  .cam-card:hover {
    border-color: var(--accent);
    box-shadow: 0 6px 28px rgba(0,212,255,0.1);
  }

  /* THUMB */
  .cam-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    overflow: hidden;
  }

  .cam-bg {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    position: relative;
  }

  /* unique gradient per category */
  .cam-bg.playas-arg   { background: linear-gradient(135deg, #0a2535 0%, #003d52 50%, #00566e 100%); }
  .cam-bg.bsas         { background: linear-gradient(135deg, #0d1a2e 0%, #1a2d4a 50%, #0a3060 100%); }
  .cam-bg.natura-arg   { background: linear-gradient(135deg, #0a1f0a 0%, #0e3018 50%, #0a4020 100%); }
  .cam-bg.latam        { background: linear-gradient(135deg, #1a0a20 0%, #2d0d35 50%, #3d1050 100%); }
  .cam-bg.mundo        { background: linear-gradient(135deg, #1a1000 0%, #2e1d00 50%, #3d2800 100%); }
  .cam-bg.estadodelmar { background: linear-gradient(135deg, #001a20 0%, #002d38 50%, #004050 100%); }
  .cam-bg.destacadas   { background: linear-gradient(135deg, #1a1200 0%, #2d2000 50%, #3d2d00 100%); }

  .cam-thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px);
    pointer-events: none;
    z-index: 1;
  }

  .cam-badge {
    position: absolute;
    top: 7px;
    left: 7px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(0,255,136,0.12);
    border: 1px solid rgba(0,255,136,0.4);
    color: var(--live);
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 1.5px;
    padding: 2px 6px;
    border-radius: 4px;
  }

  .cam-src-badge {
    position: absolute;
    top: 7px;
    right: 7px;
    z-index: 2;
    background: rgba(0,0,0,0.5);
    color: var(--muted2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .play-circle {
    position: absolute;
    bottom: 8px;
    right: 8px;
    z-index: 2;
    width: 34px; height: 34px;
    background: rgba(0,212,255,0.12);
    border: 1px solid rgba(0,212,255,0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, border-color 0.2s;
  }

  .cam-card:hover .play-circle {
    background: var(--accent);
    border-color: var(--accent);
  }

  .play-circle svg { fill: var(--accent); transition: fill 0.2s; }
  .cam-card:hover .play-circle svg { fill: #000; }

  /* INFO */
  .cam-info {
    padding: 10px 12px;
  }

  .cam-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 3px;
  }

  .cam-loc {
    font-size: 11px;
    color: var(--muted2);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .cam-loc::before {
    content: '◉';
    color: var(--accent);
    font-size: 8px;
    flex-shrink: 0;
  }

  /* ─── MODAL ─── */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal.open { display: flex; }

  .modal-box {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 860px;
    overflow: hidden;
    animation: modalPop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }

  .modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }

  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--accent);
    line-height: 1.1;
  }

  .modal-loc {
    font-size: 12px;
    color: var(--muted2);
    margin-top: 2px;
  }

  .modal-close {
    flex-shrink: 0;
    background: var(--border);
    border: none;
    color: var(--muted2);
    font-size: 16px;
    width: 30px; height: 30px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.18s, color 0.18s;
    -webkit-tap-highlight-color: transparent;
  }
  .modal-close:hover { background: var(--accent2); color: #fff; }

  /* iframe container — YouTube embed con allowfullscreen */
  .modal-player {
    position: relative;
    aspect-ratio: 16/9;
    background: #000;
    width: 100%;
  }

  .modal-player iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  /* Fallback cuando no hay ytId */
  .modal-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted2);
    font-size: 13px;
    padding: 30px;
    text-align: center;
  }

  .modal-fallback .big { font-size: 40px; }

  .open-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    background: var(--accent);
    color: #000;
    font-weight: 700;
    font-size: 13px;
    border-radius: 8px;
    text-decoration: none;
    transition: opacity 0.15s;
    margin-top: 4px;
  }
  .open-link:hover { opacity: 0.85; }

  .modal-foot {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .foot-live {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--live);
    letter-spacing: 1.5px;
  }

  .ext-btn {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted2);
    font-size: 12px;
    text-decoration: none;
    transition: border-color 0.15s, color 0.15s;
    cursor: pointer;
  }
  .ext-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* EMPTY */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
  }
  .empty .e-icon { font-size: 36px; margin-bottom: 10px; }
  .empty p { font-size: 13px; }

  /* SCROLL top btn */
  #scrollTop {
    display: none;
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 150;
    width: 40px; height: 40px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--muted2);
    font-size: 18px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, color 0.2s;
  }
  #scrollTop.visible { display: flex; }
  #scrollTop:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>

// ─── CATEGORÍAS ───
const cats = [
  { id:'destacadas', label:'⭐ Destacadas' },
  { id:'playas-arg', label:'🏖 Playas AR' },
  { id:'bsas',       label:'🏙 Buenos Aires' },
  { id:'natura-arg', label:'🏔 Naturaleza' },
  { id:'latam',      label:'🌎 Latinoamérica' },
  { id:'mundo',      label:'🌍 Mundo' },
];

let activeCat = 'destacadas';

// ─── BUILD NAV ───
const navBar = document.getElementById('nav-bar');
cats.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (c.id === activeCat ? ' active' : '');
  btn.textContent = c.label;
  btn.dataset.id = c.id;
  btn.dataset.label = c.label;
  btn.onclick = () => selectCat(c.id, c.label);
  navBar.appendChild(btn);
});

// total count
document.getElementById('total-count').textContent = cameras.length + ' CÁMARAS';

// ─── SELECT CAT ───
function selectCat(id, label) {
  activeCat = id;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  document.getElementById('sec-label').textContent = label.replace(/\S+\s/, '').toUpperCase();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── RENDER GRID ───
function render() {
  const grid = document.getElementById('cam-grid');
  const items = cameras.filter(c => c.cat === activeCat);
  document.getElementById('sec-count').textContent = items.length + ' cámaras';
  grid.innerHTML = '';

  if (!items.length) {
    grid.innerHTML = `<div class="empty"><div class="e-icon">📡</div><p>Sin cámaras en esta categoría</p></div>`;
    return;
  }

  items.forEach((cam, i) => {
    const card = document.createElement('div');
    card.className = 'cam-card';
    card.style.animationDelay = (i * 0.04) + 's';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', cam.name + ' — ' + cam.loc);

    const srcLabel = cam.noYt ? 'WEB' : 'YT';

    card.innerHTML = `
      <div class="cam-thumb">
        <div class="cam-bg ${cam.cat}">
          <span style="filter:drop-shadow(0 2px 8px rgba(0,0,0,0.5))">${cam.emoji}</span>
        </div>
        <div class="cam-badge"><div class="live-dot"></div> LIVE</div>
        <div class="cam-src-badge">${srcLabel}</div>
        <div class="play-circle">
          <svg width="13" height="13" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      <div class="cam-info">
        <div class="cam-name">${cam.name}</div>
        <div class="cam-loc">${cam.loc}</div>
      </div>
    `;

    card.onclick = () => openModal(cam);
    card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') openModal(cam); };
    grid.appendChild(card);
  });
}

// ─── MODAL ───
function openModal(cam) {
  document.getElementById('m-title').textContent = cam.name;
  document.getElementById('m-loc').textContent = cam.loc;
  document.getElementById('m-ext').href = cam.src;

  const player = document.getElementById('m-player');

  if (cam.ytId) {
    // YouTube embed con autoplay
    player.innerHTML = `<iframe
      src="https://www.youtube.com/embed/${cam.ytId}?autoplay=1&rel=0&modestbranding=1&playsinline=1"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
      title="${cam.name}">
    </iframe>`;
  } else {
    // Fuente externa — mostrar botón para abrir
    player.innerHTML = `<div class="modal-fallback">
      <div class="big">${cam.emoji}</div>
      <div style="color:var(--text);font-size:15px;font-weight:500">${cam.name}</div>
      <div style="color:var(--muted2);font-size:12px;margin-top:4px">${cam.loc}</div>
      <p style="margin-top:12px;max-width:280px;line-height:1.5">Esta cámara transmite desde su sitio web oficial.<br>Tocá el botón para verla en vivo.</p>
      <a href="${cam.src}" target="_blank" rel="noopener" class="open-link">📡 Ver cámara en vivo ↗</a>
    </div>`;
  }

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('m-player').innerHTML = '';
  document.body.style.overflow = '';
}

// Cerrar al click fuera
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// ESC key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Scroll top button
window.addEventListener('scroll', () => {
  document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 300);
});

// ─── INIT ───
render();
</script>
