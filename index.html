<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a0e;
    --surface: #0b1017;
    --card: #0f1820;
    --border: #1a2535;
    --accent: #00d4ff;
    --accent2: #ff3350;
    --text: #dce8f0;
    --muted: #3d5066;
    --muted2: #5a7080;
    --live: #00ff88;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(6,10,14,0.97);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    height: 52px;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px; letter-spacing: 5px;
    color: var(--accent);
    text-shadow: 0 0 24px rgba(0,212,255,0.4);
  }
  .logo span { color: var(--accent2); }

  .live-pill {
    display: flex; align-items: center; gap: 5px;
    background: rgba(0,255,136,0.08);
    border: 1px solid rgba(0,255,136,0.25);
    border-radius: 20px; padding: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--live); letter-spacing: 2px;
  }
  .live-dot {
    width: 6px; height: 6px;
    background: var(--live); border-radius: 50%;
    animation: blink 1.2s ease-in-out infinite;
    box-shadow: 0 0 6px var(--live);
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* ─── NAV ─── */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex; gap: 6px;
    overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  nav::-webkit-scrollbar { display: none; }

  .nav-btn {
    flex-shrink: 0;
    padding: 6px 14px; border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent; color: var(--muted2);
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.18s; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn.active {
    background: var(--accent); border-color: var(--accent);
    color: #000; font-weight: 700;
    box-shadow: 0 0 16px rgba(0,212,255,0.3);
  }

  /* ─── MAIN ─── */
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }

  .sec-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .sec-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px; letter-spacing: 3px; color: var(--muted2);
  }
  .sec-count {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--muted); background: var(--card);
    border: 1px solid var(--border); padding: 2px 8px; border-radius: 10px;
  }
  .sec-line { flex:1; height:1px; background: var(--border); }

  /* ─── GRID ─── */
  .cam-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-bottom: 24px;
  }
  @media (min-width:600px)  { .cam-grid { grid-template-columns: repeat(3,1fr); gap:12px; } }
  @media (min-width:900px)  { .cam-grid { grid-template-columns: repeat(4,1fr); } }

  /* ─── CARD ─── */
  .cam-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
    cursor: pointer; transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
    animation: fadeUp 0.3s ease both;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .cam-card:active { transform: scale(0.96); border-color: var(--accent); }
  .cam-card:hover  { border-color: var(--accent); box-shadow: 0 6px 28px rgba(0,212,255,0.1); }

  .cam-thumb {
    position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden;
  }
  .cam-bg {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font-size: 30px;
  }
  .cam-bg.playas-arg   { background: linear-gradient(135deg,#0a2535,#003d52,#00566e); }
  .cam-bg.bsas         { background: linear-gradient(135deg,#0d1a2e,#1a2d4a,#0a3060); }
  .cam-bg.natura-arg   { background: linear-gradient(135deg,#0a1f0a,#0e3018,#0a4020); }
  .cam-bg.latam        { background: linear-gradient(135deg,#1a0a20,#2d0d35,#3d1050); }
  .cam-bg.mundo        { background: linear-gradient(135deg,#1a1000,#2e1d00,#3d2800); }
  .cam-bg.destacadas   { background: linear-gradient(135deg,#12100a,#1e1800,#2a2000); }

  /* scanlines */
  .cam-thumb::after {
    content:''; position:absolute; inset:0;
    background: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);
    pointer-events:none; z-index:1;
  }

  .cam-badge {
    position:absolute; top:7px; left:7px; z-index:2;
    display:flex; align-items:center; gap:4px;
    background:rgba(0,255,136,0.12); border:1px solid rgba(0,255,136,0.4);
    color:var(--live); font-family:'JetBrains Mono',monospace;
    font-size:8px; letter-spacing:1.5px; padding:2px 6px; border-radius:4px;
  }

  .src-tag {
    position:absolute; top:7px; right:7px; z-index:2;
    background:rgba(0,0,0,0.55); color:var(--muted2);
    font-family:'JetBrains Mono',monospace; font-size:8px;
    padding:2px 6px; border-radius:4px; border:1px solid var(--border);
  }

  /* big play arrow overlay */
  .play-over {
    position:absolute; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    background: rgba(0,0,0,0);
    transition: background 0.2s;
  }
  .cam-card:hover .play-over { background: rgba(0,0,0,0.15); }

  .play-circle {
    width:42px; height:42px;
    background:rgba(0,212,255,0.12);
    border:1.5px solid rgba(0,212,255,0.5);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition: background 0.2s, transform 0.2s;
  }
  .cam-card:hover .play-circle { background:var(--accent); transform:scale(1.08); }
  .play-circle svg { fill:var(--accent); transition:fill 0.2s; }
  .cam-card:hover .play-circle svg { fill:#000; }

  .cam-info { padding:10px 12px; }
  .cam-name { font-size:13px; font-weight:500; color:var(--text); line-height:1.3; margin-bottom:3px; }
  .cam-loc  { font-size:11px; color:var(--muted2); display:flex; align-items:center; gap:4px; }
  .cam-loc::before { content:'◉'; color:var(--accent); font-size:8px; flex-shrink:0; }

  /* ─── BOTTOM SHEET (mobile-style modal) ─── */
  .sheet-backdrop {
    display:none; position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .sheet-backdrop.open { display:block; }

  .sheet {
    position:fixed; bottom:0; left:0; right:0; z-index:201;
    background: var(--card);
    border-top: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    padding: 0 0 env(safe-area-inset-bottom,0);
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    max-height: 85vh;
    overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }

  .sheet-handle {
    width:36px; height:4px; border-radius:2px;
    background:var(--border); margin:10px auto 0;
  }

  .sheet-head {
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:14px 16px 12px; gap:10px;
  }
  .sheet-title {
    font-family:'Bebas Neue',sans-serif; font-size:22px;
    letter-spacing:2px; color:var(--accent); line-height:1.1;
  }
  .sheet-loc { font-size:12px; color:var(--muted2); margin-top:3px; }

  .sheet-close {
    flex-shrink:0; background:var(--border); border:none;
    color:var(--muted2); font-size:16px;
    width:30px; height:30px; border-radius:6px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition: background 0.18s;
  }
  .sheet-close:hover { background:var(--accent2); color:#fff; }

  .sheet-body { padding:0 16px 20px; }

  /* botones de acción */
  .action-btn {
    display:flex; align-items:center; gap:12px;
    padding:14px 16px; border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface); color:var(--text);
    font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500;
    text-decoration:none; cursor:pointer;
    transition: border-color 0.18s, background 0.18s;
    width:100%; margin-bottom:10px;
    -webkit-tap-highlight-color:transparent;
  }
  .action-btn:active, .action-btn:hover { border-color:var(--accent); background:rgba(0,212,255,0.05); }

  .action-icon {
    width:40px; height:40px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
  }
  .action-icon.yt  { background:#ff0000; }
  .action-icon.web { background:var(--border); }

  .action-text { flex:1; text-align:left; }
  .action-label { font-size:14px; font-weight:500; color:var(--text); }
  .action-sub   { font-size:11px; color:var(--muted2); margin-top:1px; }

  .action-arrow { color:var(--muted); font-size:16px; }

  .sheet-tip {
    font-size:11px; color:var(--muted); text-align:center;
    padding:8px; line-height:1.5;
  }

  /* EMPTY */
  .empty { grid-column:1/-1; text-align:center; padding:50px 20px; color:var(--muted); }
  .empty .e-icon { font-size:36px; margin-bottom:10px; }

  /* scroll top */
  #scrollTop {
    display:none; position:fixed; bottom:20px; right:20px; z-index:150;
    width:38px; height:38px; background:var(--card);
    border:1px solid var(--border); border-radius:50%;
    color:var(--muted2); font-size:16px; cursor:pointer;
    align-items:center; justify-content:center; transition:border-color 0.2s,color 0.2s;
  }
  #scrollTop.visible { display:flex; }
  #scrollTop:hover { border-color:var(--accent); color:var(--accent); }
</style>

  { id:'destacadas', label:'⭐ Destacadas' },
  { id:'playas-arg', label:'🏖 Playas AR' },
  { id:'bsas',       label:'🏙 Buenos Aires' },
  { id:'natura-arg', label:'🏔 Naturaleza' },
  { id:'latam',      label:'🌎 Latinoamérica' },
  { id:'mundo',      label:'🌍 Mundo' },
];

let activeCat = 'destacadas';

// BUILD NAV
const navBar = document.getElementById('nav-bar');
cats.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (c.id === activeCat ? ' active' : '');
  btn.textContent = c.label;
  btn.dataset.id = c.id;
  btn.onclick = () => selectCat(c.id, c.label);
  navBar.appendChild(btn);
});

function selectCat(id, label) {
  activeCat = id;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  // strip emoji from label for section title
  document.getElementById('sec-label').textContent = label.replace(/^\S+\s*/, '').toUpperCase();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function render() {
  const grid = document.getElementById('cam-grid');
  const items = cameras.filter(c => c.cat === activeCat);
  document.getElementById('sec-count').textContent = items.length + ' cámaras';
  grid.innerHTML = '';

  if (!items.length) {
    grid.innerHTML = `<div class="empty"><div class="e-icon">📡</div><p>Sin cámaras en esta categoría</p></div>`;
    return;
  }

  items.forEach((cam, i) => {
    const isYT  = !!cam.ytId;
    const tag   = isYT ? 'YT' : 'WEB';

    const card = document.createElement('div');
    card.className = 'cam-card';
    card.style.animationDelay = (i * 0.035) + 's';

    card.innerHTML = `
      <div class="cam-thumb">
        <div class="cam-bg ${cam.cat}">${cam.emoji}</div>
        <div class="cam-badge"><div class="live-dot"></div> LIVE</div>
        <div class="src-tag">${tag}</div>
        <div class="play-over">
          <div class="play-circle">
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
      </div>
      <div class="cam-info">
        <div class="cam-name">${cam.name}</div>
        <div class="cam-loc">${cam.loc}</div>
      </div>
    `;
    card.onclick = () => openSheet(cam);
    grid.appendChild(card);
  });
}

function openSheet(cam) {
  document.getElementById('s-title').textContent = cam.name;
  document.getElementById('s-loc').textContent   = cam.loc;

  const body = document.getElementById('s-body');

  let html = '';

  if (cam.ytId) {
    // Dos opciones: app YouTube o web YouTube
    const ytAppUrl = `youtube://watch?v=${cam.ytId}`;
    const ytWebUrl = `https://www.youtube.com/watch?v=${cam.ytId}`;

    html += `
      <a href="${ytAppUrl}" class="action-btn">
        <div class="action-icon yt">▶</div>
        <div class="action-text">
          <div class="action-label">Abrir en YouTube</div>
          <div class="action-sub">Abre la app de YouTube directamente</div>
        </div>
        <div class="action-arrow">→</div>
      </a>
      <a href="${ytWebUrl}" target="_blank" rel="noopener" class="action-btn">
        <div class="action-icon web">🌐</div>
        <div class="action-text">
          <div class="action-label">Abrir en el navegador</div>
          <div class="action-sub">youtube.com — nueva pestaña</div>
        </div>
        <div class="action-arrow">→</div>
      </a>
      <div class="sheet-tip">📺 YouTube bloquea los videos embebidos desde apps externas.<br>Por eso te llevamos directo a la fuente.</div>
    `;
  } else if (cam.web) {
    html += `
      <a href="${cam.web}" target="_blank" rel="noopener" class="action-btn">
        <div class="action-icon web">📡</div>
        <div class="action-text">
          <div class="action-label">Ver cámara en vivo</div>
          <div class="action-sub">${cam.web.replace('https://','').split('/')[0]}</div>
        </div>
        <div class="action-arrow">→</div>
      </a>
      <div class="sheet-tip">Esta cámara transmite desde su sitio web oficial.</div>
    `;
  }

  body.innerHTML = html;

  document.getElementById('backdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeSheet() {
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

window.addEventListener('scroll', () => {
  document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 300);
});

render();
</script>
</body>
</html>
