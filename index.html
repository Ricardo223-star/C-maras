<!DOCTYPE html>
<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMVIVO — Cámaras en vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #0e1318;
    --card: #121920;
    --border: #1e2830;
    --accent: #00e5ff;
    --accent2: #ff3d57;
    --text: #e8edf2;
    --muted: #4a5a6a;
    --live: #00ff88;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8,12,16,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,229,255,0.4);
  }

  .logo span { color: var(--accent2); }

  .live-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--live);
    letter-spacing: 2px;
  }

  .live-dot {
    width: 7px; height: 7px;
    background: var(--live);
    border-radius: 50%;
    animation: pulse 1.4s infinite;
    box-shadow: 0 0 8px var(--live);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  /* NAV */
  nav {
    display: flex;
    gap: 4px;
    padding: 12px 20px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  nav::-webkit-scrollbar { display: none; }

  .nav-btn {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .nav-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .nav-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 700;
  }

  /* MAIN */
  main {
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* GRID */
  .cam-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
    margin-bottom: 32px;
  }

  .cam-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
  }

  .cam-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,229,255,0.1);
  }

  .cam-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #0a0f14;
    overflow: hidden;
  }

  .cam-thumb iframe {
    width: 100%;
    height: 100%;
    border: none;
    pointer-events: none;
  }

  .cam-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s;
  }

  .cam-card:hover .cam-thumb img {
    transform: scale(1.04);
  }

  .cam-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(8,12,16,0.7) 0%, transparent 50%);
    display: flex;
    align-items: flex-end;
    padding: 10px;
  }

  .play-btn {
    width: 40px; height: 40px;
    background: rgba(0,229,255,0.15);
    border: 1px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .cam-card:hover .play-btn {
    background: var(--accent);
  }

  .play-btn svg { fill: var(--accent); }
  .cam-card:hover .play-btn svg { fill: #000; }

  .cam-badge {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(0,255,136,0.15);
    border: 1px solid var(--live);
    color: var(--live);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    padding: 3px 7px;
    border-radius: 4px;
  }

  .cam-info {
    padding: 12px 14px;
  }

  .cam-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
  }

  .cam-loc {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .cam-loc::before {
    content: '◎';
    color: var(--accent);
    font-size: 10px;
  }

  /* MODAL */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal.open { display: flex; }

  .modal-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 900px;
    overflow: hidden;
    animation: modalIn 0.25s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }

  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--accent);
  }

  .modal-loc {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .close-btn {
    background: var(--border);
    border: none;
    color: var(--muted);
    font-size: 18px;
    width: 32px; height: 32px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .close-btn:hover { background: var(--accent2); color: #fff; }

  .modal-video {
    position: relative;
    aspect-ratio: 16/9;
    background: #000;
  }

  .modal-video iframe {
    width: 100%; height: 100%;
    border: none;
  }

  .modal-footer {
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .open-ext {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
    transition: all 0.2s;
    cursor: pointer;
  }

  .open-ext:hover { border-color: var(--accent); color: var(--accent); }

  /* PLACEHOLDER */
  .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
    background: #090d12;
  }

  .placeholder .icon { font-size: 32px; opacity: 0.4; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-state .big { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* SCANLINE effect */
  .cam-thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 1;
  }

  @media (max-width: 600px) {
    .cam-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    main { padding: 12px; }
  }
</style>

  { id: "playas-arg", label: "🏖 Playas AR" },

  { id: "natura-arg", label: "🏔 Naturaleza AR" },
  { id: "latam",      label: "🌎 Latinoamérica" },
  { id: "mundo",      label: "🌍 Mundo" },
];

let currentCat = "destacadas";

// Build nav
const navEl = document.getElementById('nav');
categories.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (c.id === currentCat ? ' active' : '');
  btn.textContent = c.label;
  btn.onclick = () => selectCat(c.id, c.label);
  btn.dataset.id = c.id;
  navEl.appendChild(btn);
});

function selectCat(id, label) {
  currentCat = id;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  document.getElementById('section-label').textContent = label.toUpperCase();
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('cam-grid');
  const items = cameras.filter(c => c.cat === currentCat);
  grid.innerHTML = '';

  if (!items.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="big">📡</div>
      <p>Sin cámaras en esta categoría aún</p>
    </div>`;
    return;
  }

  items.forEach(cam => {
    const card = document.createElement('div');
    card.className = 'cam-card';
    card.innerHTML = `
      <div class="cam-thumb">
        <img src="${cam.thumb}" alt="${cam.name}" loading="lazy" onerror="this.style.display='none';this.parentNode.querySelector('.placeholder').style.display='flex'">
        <div class="placeholder" style="display:none"><div class="icon">📡</div><span>Sin preview</span></div>
        <div class="cam-overlay">
          <div class="play-btn">
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="cam-badge">● EN VIVO</div>
      </div>
      <div class="cam-info">
        <div class="cam-name">${cam.name}</div>
        <div class="cam-loc">${cam.loc}</div>
      </div>
    `;
    card.onclick = () => openModal(cam);
    grid.appendChild(card);
  });
}

function openModal(cam) {
  document.getElementById('modal-title').textContent = cam.name;
  document.getElementById('modal-loc').textContent = cam.loc;
  document.getElementById('modal-ext').href = cam.src;

  const videoEl = document.getElementById('modal-video');
  if (cam.ytId) {
    videoEl.innerHTML = `<iframe 
      src="https://www.youtube.com/embed/${cam.ytId}?autoplay=1&mute=0&rel=0&modestbranding=1"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>`;
  } else {
    videoEl.innerHTML = `<div class="placeholder" style="display:flex;height:100%">
      <div class="icon">📡</div>
      <span>Stream no disponible</span>
    </div>`;
  }

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal-video').innerHTML = '';
  document.body.style.overflow = '';
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Init
renderGrid();
</script>

</html>
